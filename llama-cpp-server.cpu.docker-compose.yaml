services:
  llama-cpp-server:
    container_name: llama-cpp-server-${INSTANCE_ID:-default}
    image: ghcr.io/ggml-org/llama.cpp:full
    entrypoint: [
      "/app/llama-server",
      "--host", "0.0.0.0",
      "--port", "8080",
      "-m", "/models/ggml-model-Q4_K_M.gguf",
      "--mmproj", "/models/mmproj-model-f16.gguf",
      "-n", "512"
    ]
    volumes:
      - ./models:/models
    ports:
      - "${LLM_PORT:-8000}:8080"
    restart: always
