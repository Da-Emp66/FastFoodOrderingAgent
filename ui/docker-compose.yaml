services:
  fastfoodordering-ui:
    container_name: fastfoodordering-ui
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    ports:
      - "3000:3000"
      - "24678:24678"  # HMR port
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
