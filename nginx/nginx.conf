events {
    worker_connections 1024;
}

http {
    # DNS resolver for dynamic upstream resolution
    # Use Docker's internal DNS server
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Rate limiting to prevent abuse
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream services with max_fails=0 to prevent marking as down
    upstream ui {
        server fastfoodordering-ui:3000 max_fails=0;
    }

    upstream session_manager {
        server session-manager:8080 max_fails=0;
    }

    upstream dozzle {
        server dozzle:8080 max_fails=0;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name 67.8.48.44;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name 67.8.48.44;

        # SSL certificates (will be configured with Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Strong SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Main UI - Public access
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Session Manager API - Public access (used by UI)
        location /api/session/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://session_manager/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dozzle logs - Protected with basic auth
        location /logs/ {
            auth_basic "Logs Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://dozzle/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Block direct access to llama-cpp-server from external
        # Only allow internal Docker network access
    }

    # Internal admin panel (optional - highly restricted)
    server {
        listen 8443 ssl http2;
        server_name 67.8.48.44;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Restrict to specific IP addresses (add your trusted IPs)
        # allow 192.168.1.0/24;  # Your local network
        # deny all;

        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd_admin;

        location / {
            proxy_pass http://dozzle;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
