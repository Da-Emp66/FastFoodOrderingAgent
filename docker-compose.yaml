include:
  - ./ui/docker-compose.yaml
  - ./llama-cpp-server.${LLM_DEVICE_TYPE:-cpu}.docker-compose.yaml
  - ./python/fastfoodordering/docker-compose.yaml

services:
  # Nginx reverse proxy with SSL/TLS
  nginx:
    container_name: nginx-proxy-${INSTANCE_ID:-default}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"       # HTTP (redirects to HTTPS)
      - "${HTTPS_PORT:-443}:443"     # HTTPS - Main public access
      - "${ADMIN_PORT:-8443}:8443"   # HTTPS - Admin panel (optional)

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/.htpasswd_admin:/etc/nginx/.htpasswd_admin:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - nginx-logs:/var/log/nginx
    depends_on:
      - fastfoodordering-ui
      - session-manager
      - dozzle
    networks:
      - default

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot-${INSTANCE_ID:-default}
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - default

  dozzle:
    container_name: dozzle-${INSTANCE_ID:-default}
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Remove external port exposure - only accessible through nginx
    ports:
      - "${DOZZLE_PORT:-10000}:8080"
    expose:
      - "8080"
    networks:
      - default

volumes:
  certbot-conf:
    external: true
    name: certbot-conf-${INSTANCE_ID:-default}
  certbot-www:
    external: true
    name: certbot-www-${INSTANCE_ID:-default}
  nginx-logs:
    external: true
    name: nginx-logs-${INSTANCE_ID:-default}

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK_NAME:-fast-food}
