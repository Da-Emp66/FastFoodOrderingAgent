include:
  - ./ui/docker-compose.yaml
  # - ./python/fastfoodordering/docker-compose.yaml

services:
  llama-cpp-server:
    container_name: llama-cpp-server
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    entrypoint: ["/app/llama-server", "--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-model-Q4_K_M.gguf", "--mmproj", "/models/mmproj-model-f16.gguf", "-n", "4000", "-c", "20000"]
    volumes:
      - ./models:/models
    ports:
      - 8000:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 10000:8080

networks:
  default:
    name: fast-food
