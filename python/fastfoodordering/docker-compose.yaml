services:
  session-manager:
    container_name: session-manager-${INSTANCE_ID:-default}
    build:
      context: .
      dockerfile: core/session/Dockerfile
    env_file:
      - ../../.env
    environment:
      - OPENAI_BASE_URL=http://host.docker.internal:${LLM_PORT:-8000}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - BROWSER_VISIBILITY_MODE=default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Remove external port exposure - only accessible through nginx with auth
    ports:
      - "${SESSION_PORT:-5000}:8080"
    expose:
      - "8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always
    