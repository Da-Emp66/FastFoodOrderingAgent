[project]
name = "fastfoodordering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1.0",
    "dspy[mcp]>=3.0.3",
    "easy-sync>=0.2.2",
    "fastmcp>=2.12.4",
    "google-adk>=1.13.0",
    "guidance>=0.3.0",
    "litellm>=1.76.2",
    "mcp[cli]>=1.13.1",
    "nest-asyncio>=1.6.0",
    "openai>=1.106.1",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "playwright>=1.55.0",
    "python-box>=7.3.2",
    "selenium>=4.35.0",
    "stagehand>=0.5.0",
    "webdriver-manager>=4.0.2",
    "websockets>=15.0.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = ["core", "assets", "configuration"]
