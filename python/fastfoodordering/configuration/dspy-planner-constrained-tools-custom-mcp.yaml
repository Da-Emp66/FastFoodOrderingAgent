tool_mode: constrained
tools:
  mcp_servers: 
    playwright: {
      "command": "uv",
      "args": [
        "run",
        "core/web/toolserver.py",
      ],
    }
  browser_visibility:
    screenshot_tool_name: screenshot
    # snapshot_tool_name: browser_snapshot,
  tool_system_prompt: |
    You are an expert browser operator. Your goal is to select the best tool based on the current task.

    IMPORTANT: The browser screenshots show UI elements labeled with numbered boxes (0, 1, 2, etc.) from OmniParser.
    These box numbers identify clickable elements, buttons, text fields, and other interactive components.
    Use these box numbers to interact with specific elements on the page.

  tool_selection_user_prompt_format: |
    Overall Goal: {overall_goal}
    Current Task: {subtask}

    The screenshot shows UI elements labeled with box numbers (0, 1, 2, 3, etc.).
    - To click an element, use click_element_by_box_label_number with the box number
    - To type into a field, use type_text_by_box_label_number with the box number
    - Only use click_element_by_its_text_content if you cannot see a box label

    Possible Tool Options:
    {tool_options}

    Notes:
    - If asked to go to a url, use 'navigate', not a 'click' tool
    - Prefer box number tools over text-based tools for reliability

  tool_args_user_prompt_format: |
    Overall Goal: {overall_goal}
    Current Task: {subtask}
    Selected tool is {name}. Now determine the arguments.

    If using click_element_by_box_label_number or type_text_by_box_label_number:
    - Look at the screenshot and identify the box number for the target element
    - The box numbers are shown as labels on the screenshot (0, 1, 2, etc.)

planner:
  visibility_settings:
    tools_visible: True
browser_visibility_mode: debug

parser:
  parser_uri: http://${PARSER_HOST}:${PARSER_PORT}
  parser_mode: ${PARSER_MODE}
