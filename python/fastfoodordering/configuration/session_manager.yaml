tool_mode: constrained
tools:
  custom_tools:
    - function_name: start_session
      import_spec: core/session/session_tools.py
    - function_name: update_session
      import_spec: core/session/session_tools.py
    - function_name: cancel_session
      import_spec: core/session/session_tools.py
    - function_name: null
  tool_system_prompt: |
    You are a helpful assistant who specializes in helping users manage food orders.
    it is your job to start a session where an agent will order the food they described.
    Based on the user's query and your previous response, decide the tool to call, if applicable.
    Rules:
     - If the user asks a question, do not call a tool. I.e., you should return the 'null_function'.
     - Only use `start_session` when there is no Session ID yet and the user explicitly asks you to order them food from a particular restaurant.
     - Only use `update_session` when there is a non-null and non-None Session ID and the user explicitly asks you to change something about their existing order.
     - Only use `cancel_session` when there is a non-null and non-None Session ID and the user explicitly demands that you stop the current order being processed.
    Above all: Only call a tool if a user explicitly requests for you to perform that specific action. Otherwise, use the `null_function` as the tool selection.
    Tool Options:
    {tool_options}
  tool_selection_user_prompt_format: |
    User information:
      Username: {user}
      Session ID: {session_id}
      Current Geolocation: {current_geolocation}
    User's query: '{prompt}'
    Your previous response: '{response}'
  tool_args_user_prompt_format: |
    User information:
      Username: {user}
      Session ID: {session_id}
      Current Geolocation: {current_geolocation}
    User's query: '{prompt}'
    Your previous response: '{response}'

    Example:
    ```
    User information:
      Username: john.doe@gmail.com
      Session ID: none
      Current Geolocation: {"lat": -28.71, "lon": 22.573, "accuracy": 100}
    User's query: 'Can you order me a burger and fries from Wendy's?'
    Your previous response: 'I will work to schedule an order at Wendy's for you.'
    ```
    ->
    ```json
    {
      "exact_user_query": "Order a burger and fries from Wendy's.",
      "user": "john.doe@gmail.com",
      "current_geolocation": {"lat": -28.71, "lon": 22.573, "accuracy": 100}
    }
    ```

    Rules:
     - The 'user' and 'current_geolocation' fields should be have the exact same values as the input 'user' and 'current_geolocation' fields.
response:
  response_system_prompt: |
    You are a helpful assistant who specializes in helping users place food orders at restaurants nearby. Respond to the user based on the user's request. 
    For example, if the user asks for help finding a restaurant, say something like "Okay, I will help you look for a restaurant nearby." 
    If the user asks for help placing an order, say "I will work to schedule an order" at the restaurant of their choice.
  max_tokens: 200
web_agent_spec:
  image: ${WEB_AGENT_IMAGE:-web-agent}:${WEB_AGENT_TAG:-latest}
  name: ${_DYN_WEB_AGENT_USER}-session-${_DYN_WEB_AGENT_SESSION_ID}
  # command: ${WEB_AGENT_COMMAND:-bash -c "Xvfb $DISPLAY -ac -screen 0 1024x768x16" & sleep 1 && uv run core/web/serve.py}
  # volumes:
  #   - "/home/da-emp66/commercial/FastFoodOrderingAgent/python/fastfoodordering/${WEB_AGENT_CONFIG_PATH:-configuration/dspy-planner-constrained-tools-simple-import.yaml}:/app/${WEB_AGENT_CONFIG_PATH:-configuration/dspy-planner-constrained-tools-simple-import.yaml}"

  # Note: Configuration files are already included in the Docker image via COPY . /app
  # If you need to override config during development, uncomment and adjust the volume mount below:
  volumes:
    - "${PWD}/python/fastfoodordering/configuration:/app/configuration:ro"

