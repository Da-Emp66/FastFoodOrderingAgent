services:
  llama-cpp-server:
    container_name: llama-cpp-server
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    entrypoint: [
      "/app/llama-server",
      "--host", "0.0.0.0",
      "--port", "8080",
      "-m", "/models/ggml-model-Q4_K_M.gguf",
      "--mmproj", "/models/mmproj-model-f16.gguf",
      "--verbose"
    ]
    # entrypoint: [
    #   "/app/llama-server",
    #   "--host", "0.0.0.0",
    #   "--port", "8080",
    #   "-m", "/models/UI-TARS-1.5-7B.Q4_K_M.gguf",
    #   "--mmproj", "/models/UI-TARS-1.5-7B.mmproj-f16.gguf",
    #   "--verbose"
    # ]
    environment:
      LLAMA_ARG_N_PREDICT: 4000
      LLAMA_ARG_CTX_SIZE: 10000
      LLAMA_ARG_N_GPU_LAYERS: -1
    volumes:
      - ./models:/models
    ports:
      - 8000:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
