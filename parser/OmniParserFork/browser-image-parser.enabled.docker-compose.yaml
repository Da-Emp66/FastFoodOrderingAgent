services:
  fastfood-browserimageparser:
    container_name: fastfood-browserimageparser-${INSTANCE_ID:-default}
    image: fastfood-browserimageparser:latest
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8055"
    volumes:
      - ./weights:/app/weights
      - ${HOME}/.paddleocr:/root/.paddleocr
      - ${HOME}/.EasyOCR:/root/.EasyOCR
    environment:
      PARSER_PORT: 8055
      DEVICE: ${PARSER_DEVICE:-cpu}
      USE_LOCAL_SEMANTICS: false
      ANNOTATION_SCALE_FACTOR: 4
    networks:
      - default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK_NAME:-fast-food}
